name: pure_eq
description: "SK EQ — a minimal, dark-mode system equalizer with a real-time spectrum visualizer."
publish_to: 'none'
version: 1.4.0+8

environment:
  # Dart 3.6 ships with Flutter 3.27, the first release with Color.withValues().
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Frameless window, custom title bar, drag-to-move, min size, etc.
  window_manager: ^0.4.3

  # Screen work-area size, used to fit the window on small / scaled displays.
  screen_retriever: ^0.2.0

  # Reads / writes the OS master volume (Windows + macOS).
  flutter_volume_controller: ^1.3.3

  # Persists user presets and the last EQ settings.
  shared_preferences: ^2.3.3

  # System tray (Windows) / menu bar (macOS) icon. Actively maintained
  # alternative to system_tray, from the same author as window_manager.
  tray_manager: ^0.8.0

  # In-app updates: fetch the update manifest + installer, read the running
  # app's version, verify the download's SHA-256, open links / the .dmg.
  http: ^1.6.0
  package_info_plus: ^10.2.2
  crypto: ^3.0.7
  url_launcher: ^6.3.3

  # Settings folder lookup, to carry settings over from the old PureEQ name.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
